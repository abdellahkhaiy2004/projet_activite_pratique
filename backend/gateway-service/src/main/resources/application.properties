spring.application.name=gateway-service
server.port=9999

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Stage 2: dynamic routing from the Eureka registry (no hardcoded host/port).
# Route pattern: http://localhost:9999/{service-id}/{path}, service-id = spring.application.name in lower case
#   /customer-service/customers  ->  customer-service  /customers
#   /ebank-service/accounts      ->  ebank-service     /accounts
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

management.endpoints.web.exposure.include=health,info,gateway
