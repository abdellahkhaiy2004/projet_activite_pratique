spring.application.name=gateway-service
server.port=9999

# Stage 1: explicit (static) routes
spring.cloud.gateway.server.webflux.routes[0].id=customer-service-static
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8056
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/customers/**

spring.cloud.gateway.server.webflux.routes[1].id=ebank-service-static
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8057
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/accounts/**

management.endpoints.web.exposure.include=health,info,gateway
