spring.application.name=ebank-bot
server.port=8058

# Local secrets come from the root .env (never committed) or from real environment variables.
# The three paths cover launching from the project root, backend/ or backend/ebank-bot.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

# MCP client: Streamable HTTP connections to the two business services (start them before the bot)
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8056
spring.ai.mcp.client.streamable-http.connections.customer-service.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.ebank-service.url=http://localhost:8057
spring.ai.mcp.client.streamable-http.connections.ebank-service.endpoint=/mcp

# Telegram long-polling bot (token from TELEGRAM_BOT_TOKEN; the bot is skipped when it is empty or a placeholder)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# Discord bot (token from DISCORD_BOT_TOKEN; the bot is skipped when it is empty or a placeholder)
# The "Message Content Intent" must be enabled for the bot in the Discord Developer Portal.
discord.bot.token=${DISCORD_BOT_TOKEN:}

# Faster registry propagation for local development (defaults are 30 s)
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
