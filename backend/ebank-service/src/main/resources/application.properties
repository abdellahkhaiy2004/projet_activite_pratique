spring.application.name=ebank-service
server.port=8057

spring.datasource.url=jdbc:h2:mem:accounts-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info,circuitbreakers

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Feign timeouts: fail fast so the circuit breaker can react
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Resilience4j circuit breaker protecting the customer lookup used when reading accounts
# Opens when >= 50% of the last 5 calls fail (min 3 calls); stays open 10s, then allows 2 trial calls (half-open)
resilience4j.circuitbreaker.instances.customerService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.customerService.sliding-window-size=5
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.customerService.automatic-transition-from-open-to-half-open-enabled=true
management.health.circuitbreakers.enabled=true

# MCP server (Streamable HTTP, endpoint /mcp)
spring.ai.mcp.server.name=ebank-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Faster registry propagation for local development (defaults are 30 s)
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
