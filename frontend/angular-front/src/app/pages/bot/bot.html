<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h2 class="mb-0"><i class="bi bi-robot me-2"></i>Assistant</h2>
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" role="switch" id="streamSwitch"
           [ngModel]="streaming()" (ngModelChange)="streaming.set($event)" [disabled]="busy()" />
    <label class="form-check-label" for="streamSwitch">Stream the answer</label>
  </div>
</div>

<div #history class="border rounded p-3 mb-3 bg-body-tertiary" style="height: 55vh; overflow-y: auto">
  @if (messages().length === 0) {
    <p class="text-muted mb-2">Ask about customers and bank accounts, for example:</p>
    @for (example of examples; track example) {
      <button class="btn btn-sm btn-outline-secondary me-2 mb-2" (click)="send(example)">{{ example }}</button>
    }
  }

  @for (message of messages(); track $index) {
    <div class="d-flex mb-3" [class.justify-content-end]="message.role === 'user'">
      <div class="rounded px-3 py-2 shadow-sm" style="max-width: 80%; white-space: pre-wrap"
           [class.bg-primary]="message.role === 'user'" [class.text-white]="message.role === 'user'"
           [class.bg-white]="message.role === 'bot' && !message.error"
           [class.bg-danger-subtle]="message.error">
        @if (message.role === 'bot' && message.text === '' && busy()) {
          <span class="spinner-border spinner-border-sm text-secondary" role="status"></span>
          <span class="text-muted ms-2">Thinking...</span>
        } @else {
          {{ message.text }}
        }
      </div>
    </div>
  }
</div>

<form class="input-group" (ngSubmit)="send()">
  <input class="form-control" name="query" placeholder="Type your question" autocomplete="off"
         [ngModel]="query()" (ngModelChange)="query.set($event)" [disabled]="busy()" />
  <button class="btn btn-primary" type="submit" [disabled]="busy() || !query().trim()">
    <i class="bi bi-send me-1"></i>Send
  </button>
</form>
